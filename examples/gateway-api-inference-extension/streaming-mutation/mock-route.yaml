apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: streaming-mutation-route
  namespace: default
spec:
  parentRefs:
  - name: inference-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: mock-simple-backend
      port: 80
