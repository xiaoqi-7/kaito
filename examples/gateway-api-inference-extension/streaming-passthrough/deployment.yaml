apiVersion: v1
kind: Service
metadata:
  name: streaming-ext-proc
  namespace: default
spec:
  selector:
    app: streaming-ext-proc
  ports:
  - name: grpc
    port: 9000
    targetPort: 9000
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-ext-proc
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: streaming-ext-proc
  template:
    metadata:
      labels:
        app: streaming-ext-proc
    spec:
      containers:
      - name: ext-proc
        image: yiqi685/llm-guard-ext-proc:streaming
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9000
          name: grpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
