apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: streaming-test-route
  namespace: default
spec:
  parentRefs:
  - name: inference-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/chat/completions
    backendRefs:
    - name: mock-sse-backend
      port: 80
