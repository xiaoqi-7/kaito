---
apiVersion: v1
kind: ConfigMap
metadata:
  name: t2-backend-script
  namespace: default
data:
  app.py: |
    #!/usr/bin/env python3
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import time
    import json

    class T2Handler(BaseHTTPRequestHandler):
      def do_POST(self):
        self.send_response(200)
        self.send_header('content-type', 'text/event-stream')
        self.send_header('cache-control', 'no-cache')
        self.end_headers()

        chunks = [
          {"choices": [{"delta": {"content": "Hello"}}]},
          {"choices": [{"delta": {"content": " world"}}]},
          {"choices": [{"delta": {"content": "!"}}]},
        ]

        for chunk in chunks:
          line = f"data: {json.dumps(chunk)}\n\n"
          self.wfile.write(line.encode('utf-8'))
          self.wfile.flush()
          time.sleep(0.5)

        self.wfile.write(b"data: [DONE]\n\n")
        self.wfile.flush()

      def log_message(self, format, *args):
        pass

    if __name__ == '__main__':
      server = HTTPServer(('0.0.0.0', 8080), T2Handler)
      server.serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t2-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t2-backend
  template:
    metadata:
      labels:
        app: t2-backend
    spec:
      containers:
      - name: backend
        image: python:3.11-slim
        command:
        - python3
        - /app/app.py
        volumeMounts:
        - name: script
          mountPath: /app
        ports:
        - containerPort: 8080
      volumes:
      - name: script
        configMap:
          name: t2-backend-script

---
apiVersion: v1
kind: Service
metadata:
  name: t2-backend
  namespace: default
spec:
  selector:
    app: t2-backend
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: t2-route
  namespace: default
spec:
  parentRefs:
  - name: inference-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /t2
    backendRefs:
    - name: t2-backend
      port: 80
